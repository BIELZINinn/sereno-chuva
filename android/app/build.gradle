plugins {
    id "com.android.application"
}

android {
    namespace "app.sereno.chuva"
    compileSdk 34

    defaultConfig {
        applicationId "app.sereno.chuva"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.0.4"
    }

    signingConfigs {
        release {
            storeFile file("sereno.keystore")
            storePassword "sereno2026"
            keyAlias "sereno"
            keyPassword "sereno2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.webkit:webkit:1.8.0"
}
